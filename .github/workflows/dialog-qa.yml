name: Finish FollowUp dialog QA
on:
  push:
    paths: ['.github/workflows/dialog-qa.yml']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve typing focus and rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FollowUp build'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git worktree add /tmp/followup-source origin/source
          cd /tmp/followup-source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/ui.tsx')
          s=p.read_text().replace('}, [open, onClose]);','}, [open]);')
          p.write_text(s)
          PY
          git add src/components/ui.tsx
          git diff --cached --quiet || git commit -m 'Keep dialog focus stable while typing'
          git push origin HEAD:source
          cp .env.example .env.local
          npm ci --no-audit --no-fund
          npm run build
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/followup-source/out/. .
          touch .nojekyll
          rm .github/workflows/dialog-qa.yml
          git add -A
          git commit -m 'Publish final dialog QA fix'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment

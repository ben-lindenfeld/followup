name: Refresh FollowUp design
on:
  push:
    paths: ['.github/workflows/refresh-followup.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

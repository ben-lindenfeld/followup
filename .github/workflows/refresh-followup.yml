      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/followup-source
          cp .env.example .env.local
          npm ci --no-audit --no-fund
          npm run build
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/followup-source/out/. .
          touch .nojekyll
          rm -rf .github/workflows/.github
          rm .github/workflows/refresh-followup.yml
          git add -A
          git diff --cached --quiet || git commit -m "Publish refined FollowUp design"
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/followup-source/out
      - uses: actions/deploy-pages@v4
        id: deployment
